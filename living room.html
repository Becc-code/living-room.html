<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browse The Range</title>
<style>
body {

margin: 0;

font-family: Arial, sans-serif;

background: #f5f5f5;

text-center;

}

.container {

max-width: 1100px;

margin: 50px auto;

padding: 20px;

}

h1 {

margin-bottom: 10px;

}

p {

color: #777;

margin-bottom: 40px;

}

/* GRID LAYOUT */

.grid {

display: grid;

grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

gap: 25px;

}

.card {

background: white;

border-radius: 15px;

overflow: hidden;

box-shadow: 0 5px 15px rgba(0,0,0,0.1);

transition: transform ease;

}

.card:hover {

transform: translateY(-8px);

}

.card img {

width: 100%;

height: 250px;


}

,.card h3 {

padding: 15px;

margin: 0;

}
</style>
</head>

<body>

<div class="container">

<h1>Browse The Range of products</h1>

<p>We have a lot of products. You can look at all the products we have.</p>

<div class="grid">

<div class="card">

<img src="c:\Users\STUDENT\Downloads\hh.jpg" alt="Dining">

<h3>Dining products</h3>

</div>

<div class="card">

<img src="c:\Users\STUDENT\Downloads\kk.jpg" alt="Living">

<h3>Living products</h3>

</div>

<div class="card">

<img src="c:\Users\STUDENT\Downloads\rr.jpg "alt="Bedroom">

<h3>Bedroom products</h3>

</div>

</div>

</div>

</body>

</html>
